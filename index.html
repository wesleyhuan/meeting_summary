<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Subtitle Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #17171b;
      --border: #2a2a32;
      --accent: #6c63ff;
      --accent-dim: #3d3880;
      --text: #e8e8f0;
      --text-dim: #7a7a90;
      --interim: #a8a4ff;
      --final: #ffffff;
      --danger: #ff5f5f;
      --success: #5fff9b;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .logo-dot.listening {
      animation: pulse 1.2s infinite;
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.4); opacity: 0.7; }
    }

    /* ── Controls bar ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-start  { background: var(--accent);  color: #fff; }
    .btn-stop   { background: var(--danger);  color: #fff; }
    .btn-clear  { background: var(--border);  color: var(--text); }
    .btn-copy   { background: var(--border);  color: var(--text); }
    .btn-save   { background: var(--border);  color: var(--text); }
    .btn:hover:not(:disabled) { filter: brightness(1.15); }

    select, input[type=range] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    select:focus { outline: 2px solid var(--accent); }

    .range-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .range-group input { width: 90px; accent-color: var(--accent); }

    .status-badge {
      margin-left: auto;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--border);
      color: var(--text-dim);
      transition: background 0.3s, color 0.3s;
    }

    .status-badge.active {
      background: rgba(108,99,255,0.2);
      color: var(--interim);
    }

    /* ── Transcript area ── */
    .transcript-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transcript-area::-webkit-scrollbar { width: 6px; }
    .transcript-area::-webkit-scrollbar-track { background: transparent; }
    .transcript-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .entry {
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .timestamp {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .entry-text {
      color: var(--final);
      line-height: 1.55;
      word-break: break-word;
    }

    /* ── Live subtitle strip ── */
    .subtitle-strip {
      position: sticky;
      bottom: 0;
      background: linear-gradient(0deg, rgba(13,13,15,0.98) 80%, transparent);
      padding: 20px 24px 24px;
      min-height: 90px;
      display: flex;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .subtitle-text {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--interim);
      text-shadow: 0 2px 12px rgba(108,99,255,0.4);
      letter-spacing: -0.01em;
      max-width: 100%;
      word-break: break-word;
      min-height: 2.2em;
      transition: font-size 0.2s;
    }

    .subtitle-text.empty {
      color: var(--text-dim);
      font-weight: 400;
      font-size: 1rem;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-dim);
      font-size: 0.9rem;
      text-align: center;
      padding: 40px;
      user-select: none;
    }

    .empty-icon { font-size: 3rem; opacity: 0.3; }

    /* ── Waveform ── */
    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
    }

    .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0;
      transform: scaleY(0.2);
      transition: opacity 0.3s, transform 0.3s;
    }

    .waveform.active .bar {
      opacity: 0.8;
      animation: wave 0.8s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { animation-delay: 0.0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; height: 18px; }
    .bar:nth-child(3) { animation-delay: 0.2s; height: 24px; }
    .bar:nth-child(4) { animation-delay: 0.1s; height: 20px; }
    .bar:nth-child(5) { animation-delay: 0.0s; }

    @keyframes wave {
      from { transform: scaleY(0.3); }
      to   { transform: scaleY(1);   }
    }

    /* ── Confidence bar ── */
    .confidence-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px 10px;
      font-size: 0.75rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .conf-bar-bg {
      flex: 1;
      max-width: 160px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .conf-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 2px;
      transition: width 0.4s;
      width: 0%;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .subtitle-text { font-size: 1.2rem; }
      .controls { gap: 7px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-dot" id="logoDot"></div>
    Live Subtitle Generator
  </div>
  <div class="waveform" id="waveform">
    <div class="bar" style="height:12px"></div>
    <div class="bar" style="height:18px"></div>
    <div class="bar" style="height:24px"></div>
    <div class="bar" style="height:18px"></div>
    <div class="bar" style="height:12px"></div>
  </div>
</header>

<!-- Controls -->
<div class="controls">
  <button class="btn btn-start" id="btnStart">&#9679; Start</button>
  <button class="btn btn-stop"  id="btnStop"  disabled>&#9632; Stop</button>

  <select id="langSelect" title="Recognition language">
    <option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option>
    <option value="zh-CN">Chinese (Simplified)</option>
    <option value="zh-TW">Chinese (Traditional)</option>
    <option value="ja-JP">Japanese</option>
    <option value="ko-KR">Korean</option>
    <option value="es-ES">Spanish</option>
    <option value="fr-FR">French</option>
    <option value="de-DE">German</option>
    <option value="pt-BR">Portuguese (BR)</option>
    <option value="ru-RU">Russian</option>
    <option value="ar-SA">Arabic</option>
    <option value="hi-IN">Hindi</option>
    <option value="th-TH">Thai</option>
    <option value="vi-VN">Vietnamese</option>
    <option value="id-ID">Indonesian</option>
    <option value="ms-MY">Malay</option>
  </select>

  <div class="range-group" title="Subtitle font size">
    A
    <input type="range" id="sizeRange" min="0.8" max="3" step="0.1" value="1.6" />
    A+
  </div>

  <button class="btn btn-clear" id="btnClear">Clear</button>
  <button class="btn btn-copy"  id="btnCopy">Copy</button>
  <button class="btn btn-save"  id="btnSave">Save .txt</button>

  <span class="status-badge" id="statusBadge">Idle</span>
</div>

<!-- Transcript scroll area -->
<div class="transcript-area" id="transcriptArea">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">&#127908;</div>
    <div>Press <strong>Start</strong> and allow microphone access</div>
    <div style="font-size:0.78rem">Works best in Chrome or Edge</div>
  </div>
</div>

<!-- Confidence row -->
<div class="confidence-row" id="confRow" style="display:none">
  Confidence:
  <div class="conf-bar-bg"><div class="conf-bar-fill" id="confFill"></div></div>
  <span id="confLabel">—</span>
</div>

<!-- Live subtitle strip -->
<div class="subtitle-strip">
  <div class="subtitle-text empty" id="subtitleText">Waiting to start…</div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;
  let finalTranscript = '';
  let sessionEntries = [];
  let startTime = null;

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const btnStart      = document.getElementById('btnStart');
  const btnStop       = document.getElementById('btnStop');
  const btnClear      = document.getElementById('btnClear');
  const btnCopy       = document.getElementById('btnCopy');
  const btnSave       = document.getElementById('btnSave');
  const langSelect    = document.getElementById('langSelect');
  const sizeRange     = document.getElementById('sizeRange');
  const statusBadge   = document.getElementById('statusBadge');
  const subtitleText  = document.getElementById('subtitleText');
  const transcriptArea= document.getElementById('transcriptArea');
  const emptyState    = document.getElementById('emptyState');
  const logoDot       = document.getElementById('logoDot');
  const waveform      = document.getElementById('waveform');
  const confRow       = document.getElementById('confRow');
  const confFill      = document.getElementById('confFill');
  const confLabel     = document.getElementById('confLabel');
  const toast         = document.getElementById('toast');

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function showToast(msg, dur = 2200) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), dur);
  }

  function elapsed() {
    if (!startTime) return '0:00';
    const s = Math.floor((Date.now() - startTime) / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function setListeningUI(on) {
    isListening = on;
    btnStart.disabled = on;
    btnStop.disabled  = !on;
    logoDot.classList.toggle('listening', on);
    waveform.classList.toggle('active', on);
    statusBadge.textContent = on ? 'Listening…' : 'Idle';
    statusBadge.classList.toggle('active', on);
    if (!on) {
      subtitleText.textContent = 'Waiting to start…';
      subtitleText.classList.add('empty');
    }
  }

  function addEntry(text, confidence) {
    if (!text.trim()) return;

    // Hide empty state
    emptyState.style.display = 'none';

    const ts = new Date().toLocaleTimeString();
    sessionEntries.push({ ts, text });

    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `
      <div class="timestamp">${ts} · ${elapsed()}</div>
      <div class="entry-text">${escapeHtml(text)}</div>
    `;
    transcriptArea.appendChild(entry);
    transcriptArea.scrollTop = transcriptArea.scrollHeight;

    // Confidence bar
    if (typeof confidence === 'number' && confidence > 0) {
      confRow.style.display = 'flex';
      const pct = Math.round(confidence * 100);
      confFill.style.width = pct + '%';
      confLabel.textContent = pct + '%';
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Font size slider ─────────────────────────────────────────────────────────
  sizeRange.addEventListener('input', () => {
    subtitleText.style.fontSize = sizeRange.value + 'rem';
  });

  // ── Speech Recognition ───────────────────────────────────────────────────────
  function buildRecognition() {
    if (!SpeechRecognition) {
      alert('Speech Recognition is not supported in this browser.\nPlease use Google Chrome or Microsoft Edge.');
      return null;
    }

    const r = new SpeechRecognition();
    r.continuous      = true;
    r.interimResults  = true;
    r.maxAlternatives = 1;
    r.lang            = langSelect.value;

    r.onstart = () => {
      setListeningUI(true);
      startTime = startTime || Date.now();
    };

    r.onresult = (e) => {
      let interim = '';
      let latestFinal = '';
      let latestConf = 0;

      for (let i = e.resultIndex; i < e.results.length; i++) {
        const result = e.results[i];
        const transcript = result[0].transcript;
        if (result.isFinal) {
          latestFinal += transcript;
          latestConf = result[0].confidence;
        } else {
          interim += transcript;
        }
      }

      if (latestFinal) {
        addEntry(latestFinal.trim(), latestConf);
        finalTranscript += latestFinal;
      }

      const live = interim || latestFinal;
      if (live.trim()) {
        subtitleText.textContent = live;
        subtitleText.classList.remove('empty');
      }
    };

    r.onerror = (e) => {
      const friendly = {
        'no-speech'        : 'No speech detected — still listening.',
        'audio-capture'    : 'Microphone not found.',
        'not-allowed'      : 'Microphone access denied. Please allow it in your browser.',
        'network'          : 'Network error. Check your connection.',
        'aborted'          : null,
      };
      const msg = friendly[e.error] || `Error: ${e.error}`;
      if (msg) showToast(msg, 3500);
    };

    r.onend = () => {
      // Auto-restart if we're supposed to still be listening
      if (isListening) {
        try { r.start(); } catch(_) {}
      } else {
        setListeningUI(false);
      }
    };

    return r;
  }

  // ── Button handlers ──────────────────────────────────────────────────────────
  btnStart.addEventListener('click', () => {
    recognition = buildRecognition();
    if (!recognition) return;
    try {
      recognition.start();
    } catch(err) {
      showToast('Could not start: ' + err.message, 3000);
    }
  });

  btnStop.addEventListener('click', () => {
    isListening = false;
    if (recognition) {
      recognition.stop();
      recognition = null;
    }
    setListeningUI(false);
  });

  btnClear.addEventListener('click', () => {
    sessionEntries = [];
    finalTranscript = '';
    startTime = null;
    transcriptArea.innerHTML = '';
    transcriptArea.appendChild(emptyState);
    emptyState.style.display = 'flex';
    confRow.style.display = 'none';
    confFill.style.width = '0%';
    confLabel.textContent = '—';
    subtitleText.textContent = isListening ? '' : 'Waiting to start…';
    subtitleText.classList.toggle('empty', !isListening);
  });

  btnCopy.addEventListener('click', () => {
    const text = sessionEntries.map(e => `[${e.ts}] ${e.text}`).join('\n');
    if (!text) { showToast('Nothing to copy yet.'); return; }
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard!'));
  });

  btnSave.addEventListener('click', () => {
    const text = sessionEntries.map(e => `[${e.ts}] ${e.text}`).join('\n');
    if (!text) { showToast('Nothing to save yet.'); return; }
    const blob = new Blob([text], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `subtitle_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Saved!');
  });

  // Rebuild recognition when language changes while running
  langSelect.addEventListener('change', () => {
    if (isListening) {
      isListening = false;
      if (recognition) { recognition.stop(); recognition = null; }
      setTimeout(() => {
        isListening = true;
        recognition = buildRecognition();
        if (recognition) recognition.start();
      }, 400);
    }
  });
</script>
</body>
</html>
